name: Build NEIN LINE IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          # 解決 FileNotFoundError：補齊 macOS 缺少的 Linux 打包工具
          brew install wget dpkg

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          # 確保安裝 NEIN 腳本執行所需的 Python 模組
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi

      - name: Download Decrypted LINE IPA
        run: |
          # 下載你的 pCloud 解密版原版 LINE IPA
          curl -L -o line_original.ipa "https://pcloud.com"

      - name: Run NEIN Script
        run: |
          mkdir -p output
          # 執行 NEIN 注入（使用正統 macOS 的 python3 指令）
          python3 tools/main.py --keychain-compat --remove-ads --hide-promotional-tabs line_original.ipa output/NEIN-LINE-secondary.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEIN-LINE-IPA
          path: output/NEIN-LINE-secondary.ipa
