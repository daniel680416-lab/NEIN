name: Build NEIN LINE IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: brew install wget dpkg

      - name: Download Decrypted LINE IPA
        run: |
          # 使用你提供的 AList 直連網址下載原版 LINE IPA
          curl -L -o line_original.ipa "http://mamayoga.ddns.net:8080/d/root/line_original.ipa?sign=OwC36S4YB-CHomKw4e51bpenZjlVXO4euj1hYZmsQI4=:0"

      - name: Run NEIN Script
        run: |
          mkdir -p output
          python3 tools/main.py --keychain-compat --remove-ads --hide-promotional-tabs line_original.ipa output/NEIN-LINE-secondary.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEIN-LINE-IPA
          path: output/NEIN-LINE-secondary.ipa
